    <script>
      // Disparar ViewContent via CAPI + Pixel, respeitando carregamento assíncrono
      var MAX_VIEW_CONTENT_ATTEMPTS = 20;
      var viewContentAttempts = 0;
      function triggerViewContent() {
        if (typeof window.fbCAPI_trackViewContent === "function") {
          window.fbCAPI_trackViewContent({
            contentName: "Quiz Loter.IA - Landing",
            value: 37,
            currency: "BRL"
          });
          return;
        }
        if (viewContentAttempts < MAX_VIEW_CONTENT_ATTEMPTS) {
          viewContentAttempts += 1;
          window.setTimeout(triggerViewContent, 200);
        }
      }
      // ViewContent agora é disparado aos 70% da VSL.
    </script>
